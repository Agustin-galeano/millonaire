# Compila Millonaire para Android en los servidores de GitHub.
# Se ejecuta solo cada vez que subís cambios, o a mano desde la pestaña "Actions".
name: Compilar Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # "true" si cargaste tu llave de firma en Settings > Secrets
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y copiar el juego a Android
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK de prueba (para instalar en tu celular)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: millonaire-apk-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Versión para Google Play (solo si cargaste tu llave en los Secrets) ---
      - name: Preparar llave de firma
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/millonaire.jks
        shell: bash

      - name: Compilar AAB firmado (lo que se sube a Google Play)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/millonaire.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Subir el AAB
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: millonaire-aab-google-play
          path: android/app/build/outputs/bundle/release/app-release.aab
